{% extends 'base.html' %}
{% block title %}{% if expense %}Edit Expense{% else %}New Expense{% endif %}{% endblock %}
{% block content %}
<h2>{% if expense %}Edit Expense{% else %}New Expense{% endif %}</h2>
<form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Shipment</label>
    <select name="shipment_id">
        {% for shipment in shipments %}<option value="{{ shipment.id }}" {% if expense and expense.shipment_id == shipment.id %}selected{% endif %}>{{ shipment.reference_no }}</option>{% endfor %}
    </select>
    <label>Category</label><select name="category"><option value="Freight" {% if expense and expense.category == 'Freight' %}selected{% endif %}>Freight</option><option value="Customs Duty" {% if expense and expense.category == 'Customs Duty' %}selected{% endif %}>Customs Duty</option><option value="Insurance" {% if expense and expense.category == 'Insurance' %}selected{% endif %}>Insurance</option></select>
    <label>Description</label><input type="text" name="description" value="{{ expense.description if expense else '' }}" required>
    <label>Amount</label><input type="number" step="0.01" name="amount" value="{{ expense.amount if expense else '' }}" required>
    <label>Currency</label><input type="text" name="currency" value="{{ expense.currency if expense else 'USD' }}">
    <label>Expense Date</label><input type="date" name="expense_date" value="{{ expense.expense_date if expense else '' }}">
    <label>Vendor</label><input type="text" name="vendor" value="{{ expense.vendor if expense else '' }}">
    <label>Payment Status</label><select name="payment_status"><option value="Pending" {% if expense and expense.payment_status == 'Pending' %}selected{% endif %}>Pending</option><option value="Partially Paid" {% if expense and expense.payment_status == 'Partially Paid' %}selected{% endif %}>Partially Paid</option><option value="Paid" {% if expense and expense.payment_status == 'Paid' %}selected{% endif %}>Paid</option></select>
    <label>Payment Reference</label><input type="text" name="payment_reference" value="{{ expense.payment_reference if expense else '' }}">
    <label>Notes</label><textarea name="notes">{{ expense.notes if expense else '' }}</textarea>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Save</button><a href="/expenses" class="btn">Cancel</a></div>
</form>
{% endblock %}
