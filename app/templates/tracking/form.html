{% extends 'base.html' %}
{% block title %}Add Milestone{% endblock %}
{% block content %}
<h2>Add Milestone for {{ shipment.reference_no }}</h2>
<form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Milestone</label><input type="text" name="milestone" required>
    <label>Date</label><input type="datetime-local" name="milestone_date" required>
    <label>Location</label><input type="text" name="location">
    <label>Status</label><select name="status"><option>Booked</option><option>In Progress</option><option>Completed</option></select>
    <label>Remarks</label><textarea name="remarks"></textarea>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Save</button><a href="/tracking/{{ shipment.id }}" class="btn">Cancel</a></div>
</form>
{% endblock %}
